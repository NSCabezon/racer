# =============================================================================
# Star Wars Episode I: Racer - N64 Static Recompilation Config
# =============================================================================
# "Now THIS is podracing!" - Anakin Skywalker
#
# Target: N64Recomp static recompiler
# ROM: Star Wars Episode I - Racer (U) [!].z64
# Game Code: NEPE
# CRC1: 0x72F70398  CRC2: 0x6556A98B
# =============================================================================

[input]
entrypoint = 0x80000400
symbols_file_path = "symbols.toml"
rom_file_path = "baserom.z64"
output_func_path = "RecompiledFuncs"
single_file_output = false
functions_per_output_file = 50
uses_mips3_float_mode = false
bss_section_suffix = ".bss"
unpaired_lo16_warnings = false

# =============================================================================
# Patches
# =============================================================================
[patches]

# Stub all libultra OS functions (0x8008C000+) and cache management functions.
# These will be reimplemented by N64ModernRuntime (ultramodern).
# NOT stubbed (plain C libultra, needed by the game): the printf family
# (_Printf 0x80093180, _Putfld 0x80092B10, _Litob 0x80096BF0, _Genld 0x80096E90,
# _Ldtob 0x80097400, lldiv 0x80097E60, ldiv 0x80097F60).
# Also NOT stubbed: libaudio (synth driver, voices, filters: alSynNew 0x800887D0,
# 0x8008D510..0x80090450, 0x80095AA0..0x80096790). It is plain C the game's
# audio needs; stubbing it produced empty command lists and silence. The set
# was found by reachability from alSynNew / alAudioFrame (0x80088538) / the
# sound player handler (0x80088BFC), jal targets plus function pointers.
stubs = [
    "func_800879C4",
    "static_0_80087CC0",
    # 0x800887D0 is libaudio alSynNew (named in symbols.toml), not a cache
    # writeback: stubbing it left the audio synth driver empty (silence).
    "cache_inval_80088AD0",
    # osViSetEvent at 0x8008C090: renamed and handled by N64Recomp reimplemented_funcs
    # 0x8008C100 osEepromLongRead, 0x8008C190 osEepromLongWrite, 0x8008C280 osEepromProbe,
    # 0x8008C390 osViSetSpecialFeatures, 0x80094C80 osEepromRead, 0x80094ED0 osEepromWrite:
    # reimplemented by librecomp/ultramodern, not stubbed.
    # osGetTime/osSetCompare COP0 helpers after osGetCount (0x8008C550)
    "func_8008C560",
    # func_8008C390 split: tail portion still stubbed
    # osRecvMesg, osGetCount: handled by N64Recomp reimplemented_funcs
    # 0x8008C770 = osViGetCurrentFramebuffer, 0x8008C7B0 = osJamMesg: reimplemented, not stubbed
    # func_8008C930 split: exception handler still stubbed
    "func_8008C930_exception",
    # __osDisableInt, __osRestoreInt: handled by N64Recomp reimplemented_funcs
